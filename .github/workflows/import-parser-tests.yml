name: Import parser tests

on:
  pull_request:
    paths:
      - "src/utils/sessionDataParser.ts"
      - "src/utils/sessionDataParser.test.ts"
      - "src/utils/sellerDataParser.ts"
      - "src/utils/sellerDataParser.test.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/import-parser-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import-parser-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run import parser tests
        run: bun run test
