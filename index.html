    <script>
      // Prevent aggressive reloads on network drops or iframe disconnects
      (function() {
        if (typeof window === 'undefined') return;
        // Intercept Vite development websocket so network blips do not cause reconnect reloads
        var OrigWS = window.WebSocket;
        if (OrigWS) {
          window.WebSocket = function(url, protocols) {
            var protoStr = Array.isArray(protocols) ? protocols.join(',') : (protocols || '');
            var urlStr = String(url || '');
            if (protoStr.indexOf('vite-hmr') !== -1 || protoStr.indexOf('vite-ping') !== -1 || urlStr.indexOf('token=') !== -1) {
              return {
                url: urlStr,
                readyState: 1, // OPEN
                send: function() {},
                close: function() {},
                addEventListener: function(evt, fn) {
                  if (evt === 'open') setTimeout(function() { try { fn({ type: 'open' }); } catch(e) {} }, 10);
                },
                removeEventListener: function() {},
                dispatchEvent: function() { return false; },
                onopen: null, onclose: null, onerror: null, onmessage: null
              };
            }
            return new OrigWS(url, protocols);
          };
          window.WebSocket.prototype = OrigWS.prototype;
        }
      })();
    </script>
